# Netlify: builds the PUBLIC page (without the owner's own PCG files) on every push and publishes only what the
# page needs (index.html, samples/, and the app files: manifest, service worker, icons), not the sources, tests or docs.
[build]
  command = "rm -rf dist && mkdir dist && python3 build.py dist/index.html --public && cp -r samples icons manifest.webmanifest sw.js dist/"
  publish = "dist"
